<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ענפים — כניסה למערכת</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-brand">
            <div class="brand-icon">
                <img src="assets/logo.svg" alt="ANAFIM" style="height:80px;margin-bottom:8px">
            </div>
            <h1 style="font-size:3rem;letter-spacing:-1px">ענפים</h1>
            <p>פלטפורמת ניהול מאמנים</p>
        </div>

        <div class="login-card">
            <h2>כניסה למערכת</h2>

            <div id="loginError" class="error-message" style="display:none"></div>

            <!-- Google Sign-In -->
            <button id="googleBtn" type="button" style="
                width:100%; padding:12px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
                background:rgba(255,255,255,0.1); color:white; font-family:inherit; font-size:0.95rem;
                font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;
                gap:10px; transition:all 200ms; margin-bottom:20px; backdrop-filter:blur(4px);">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.7 35.5 16.3 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C37 39 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/>
                </svg>
                המשך עם Google
            </button>

            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
                <div style="flex:1;height:1px;background:rgba(255,255,255,0.12)"></div>
                <span style="color:rgba(255,255,255,0.35);font-size:0.78rem">או כניסה עם אימייל</span>
                <div style="flex:1;height:1px;background:rgba(255,255,255,0.12)"></div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>כתובת אימייל</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>סיסמה</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-full" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>כניסה</span>
                </button>
            </form>

            <div class="login-footer">
                <p>שכחת סיסמה? <a href="#" id="forgotLink">לחץ כאן</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Redirect if already logged in
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'app.html';
        });

        // Google Sign-In
        document.getElementById('googleBtn').addEventListener('click', async () => {
            const btn    = document.getElementById('googleBtn');
            const errDiv = document.getElementById('loginError');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:white"></div> מתחבר עם Google...';
            errDiv.style.display = 'none';
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                await auth.signInWithPopup(provider);
                // onAuthStateChanged redirects automatically
            } catch (err) {
                const msgs = {
                    'auth/popup-closed-by-user':     'החלון נסגר לפני השלמת הכניסה',
                    'auth/popup-blocked':             'הדפדפן חסם את החלון — אפשר pop-ups לאתר זה',
                    'auth/cancelled-popup-request':   'הבקשה בוטלה',
                };
                errDiv.textContent   = msgs[err.code] || 'שגיאת Google: ' + err.message;
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.7 35.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C37 39 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> המשך עם Google`;
            }
        });

        // Hover effect on Google button
        const gBtn = document.getElementById('googleBtn');
        gBtn.addEventListener('mouseenter', () => { gBtn.style.background = 'rgba(255,255,255,0.16)'; gBtn.style.borderColor = 'rgba(255,255,255,0.3)'; });
        gBtn.addEventListener('mouseleave', () => { gBtn.style.background = 'rgba(255,255,255,0.1)'; gBtn.style.borderColor = 'rgba(255,255,255,0.15)'; });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('loginBtn');
            const errDiv   = document.getElementById('loginError');

            btn.innerHTML  = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:white"></div><span>מתחבר...</span>';
            btn.disabled   = true;
            errDiv.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // onAuthStateChanged will redirect
            } catch (err) {
                const msgs = {
                    'auth/user-not-found':   'כתובת האימייל לא נמצאה במערכת',
                    'auth/wrong-password':   'סיסמה שגויה',
                    'auth/invalid-email':    'כתובת אימייל לא תקינה',
                    'auth/too-many-requests':'יותר מדי ניסיונות. נסה שוב מאוחר יותר',
                };
                errDiv.textContent  = msgs[err.code] || 'שגיאה בכניסה: ' + err.message;
                errDiv.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>כניסה</span>';
                btn.disabled  = false;
            }
        });

        document.getElementById('forgotLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = prompt('הכנס את כתובת האימייל שלך לאיפוס סיסמה:');
            if (!email) return;
            try {
                await auth.sendPasswordResetEmail(email);
                alert('✅ אימייל לאיפוס סיסמה נשלח ל-' + email);
            } catch {
                alert('שגיאה — בדוק את כתובת האימייל');
            }
        });
    </script>
</body>
</html>
